<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Probe Photo Eggs</title>

<style>
  :root { --bg: #f4f4f2; --ink: #222; --muted: #666; --card: #fff; --line: #ddd; --on: #2f5fd0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141516; --ink: #eee; --muted: #9a9a9a; --card: #1e2022; --line: #33363a; --on: #7aa2ff; }
  }
  :root[data-theme="dark"] { --bg: #141516; --ink: #eee; --muted: #9a9a9a; --card: #1e2022; --line: #33363a; --on: #7aa2ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .intro { margin: 0 0 18px; color: var(--muted); }
  .layout { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  .stage { position: sticky; top: 12px; }
  @media (max-width: 760px) { .stage { position: static; max-width: 420px; margin: 0 auto; width: 100%; } }
  .frame { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: #fff;
           box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  .frame img, .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .frame iframe { pointer-events: none; }
  .now { min-height: 1.5em; margin: 8px 2px 0; color: var(--muted); font-size: 14px; }
  .controls { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .controls button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .card { position: relative; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--card); }
  .card b { display: block; }
  .card small { color: var(--muted); }
  .card.playing { border-color: var(--on); box-shadow: 0 0 0 2px var(--on) inset; }
  .card a { position: absolute; top: 8px; right: 10px; font-size: 12px; color: var(--muted); }
  .video { margin-top: 32px; }
  video { width: 100%; max-width: 420px; border-radius: 10px; background: #000; display: block; }
  .video p { color: var(--muted); }
  a { color: var(--on); }
</style>
</head>
<body>
<main>
  <h1>Probe photo easter eggs</h1>
  <p class="intro">Little animations made for the photo on my home page: a silicon probe under the microscope.
    Click any card to play it. Each card's "link" goes straight to that animation.</p>

  <div class="layout">
    <div class="stage">
      <div class="frame" id="frame">
        <img src="../img/probe24_full.jpg" alt="Silicon probe shanks under the microscope">
      </div>
      <div class="now" id="now">Loading the animations…</div>
      <div class="controls">
        <button id="all">Play all in order</button>
        <button id="stop">Stop</button>
      </div>
    </div>
    <div id="list"></div>
  </div>

  <section class="video">
    <h2>All of them as one video</h2>
    <video src="eggreel.mp4" controls playsinline preload="metadata"></video>
    <p>2.5 minutes, 3 MB. <a href="eggreel.mp4" download>Download the video</a></p>
  </section>
</main>

<script>
  const frameBox = document.getElementById('frame'), now = document.getElementById('now');
  const player = document.createElement('iframe');
  player.src = '../index.html?player=1';
  player.title = 'Animation player';
  player.style.opacity = 0;                 // shows once ready; it starts as the same photo
  frameBox.appendChild(player);

  let eggs = [], cards = {}, playing = null, queue = [];
  const send = msg => player.contentWindow.postMessage(msg, '*');

  function play(name) {
    queue = queue.filter(n => n !== name);
    send({ type: 'egglab-play', name });
    try { history.replaceState(null, '', `#${name}`); } catch (e) { /* file:// */ }
  }
  function setPlaying(name) {
    if (playing && cards[playing]) cards[playing].classList.remove('playing');
    playing = name;
    if (name && cards[name]) cards[name].classList.add('playing');
  }

  function buildList() {
    const list = document.getElementById('list');
    ['Cartoons', 'Light shows', 'Whole-photo scenes'].forEach(kind => {
      const group = eggs.filter(e => e.kind === kind);
      if (!group.length) return;
      const h = document.createElement('h2');
      h.textContent = kind;
      const box = document.createElement('div');
      box.className = 'cards';
      group.forEach(e => {
        const b = document.createElement('button');
        b.className = 'card';
        b.innerHTML = `<b>${e.name}</b><small>${e.note}</small>`;
        b.onclick = () => { queue = []; if (playing === e.name) send({ type: 'egglab-stop' }); else play(e.name); };
        const link = document.createElement('a');
        link.href = `#${e.name}`;
        link.textContent = 'link';
        link.onclick = ev => ev.stopPropagation();
        b.appendChild(link);
        cards[e.name] = b;
        box.appendChild(b);
      });
      list.append(h, box);
    });
  }

  addEventListener('message', ev => {
    if (ev.source !== player.contentWindow) return;
    const m = ev.data || {};
    if (m.type === 'egglab-ready') {
      eggs = m.eggs || [];
      buildList();
      player.style.opacity = 1;
      now.textContent = `${eggs.length} animations. Pick one.`;
      const first = decodeURIComponent(location.hash.slice(1));
      if (cards[first]) play(first);
    } else if (m.type === 'egglab-playing') {
      setPlaying(m.name);
      now.textContent = `Playing: ${m.name}`;
    } else if (m.type === 'egglab-done') {
      if (playing === m.name) setPlaying(null);
      if (queue.length) setTimeout(() => { if (!playing && queue.length) play(queue[0]); }, 600);
      else if (!playing) now.textContent = 'Pick another.';
    }
  });
  addEventListener('hashchange', () => {
    const name = decodeURIComponent(location.hash.slice(1));
    if (cards[name] && playing !== name) { queue = []; play(name); }
  });
  document.getElementById('all').onclick = () => {
    if (!eggs.length) return;
    queue = eggs.map(e => e.name);
    play(queue[0]);
  };
  document.getElementById('stop').onclick = () => { queue = []; send({ type: 'egglab-stop' }); };
</script>
</body>
</html>
