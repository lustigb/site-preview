<script>
  // Click any figure image to view it large; close with the x, a click outside, or Esc.
  (function () {
    const imgs = document.querySelectorAll(".dc-figure img, .person-figure img, .signature.photo img:not(#home-photo)");
    if (!imgs.length) return;
    const box = document.createElement("div");
    box.className = "lightbox";
    box.innerHTML = '<button class="lightbox-close" aria-label="Close">&times;</button><div class="lightbox-body"><img alt=""><div class="lightbox-caption"></div></div>';
    document.body.appendChild(box);
    const big = box.querySelector("img");
    const cap = box.querySelector(".lightbox-caption");
    const close = () => box.classList.remove("open");
    imgs.forEach(img => {
      img.classList.add("zoomable");
      img.addEventListener("click", () => {
        big.src = img.dataset.full || img.currentSrc || img.src;          // data-full = higher-resolution file, if given
        const fc = img.closest("figure")?.querySelector("figcaption");     // a figure's legend shows under the image
        cap.innerHTML = fc ? fc.innerHTML : "";
        cap.hidden = !fc;
        box.classList.add("open");
      });
    });
    box.addEventListener("click", e => { if (e.target === box || e.target.classList.contains("lightbox-close")) close(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  })();
</script>
