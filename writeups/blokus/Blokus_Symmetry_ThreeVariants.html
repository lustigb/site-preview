<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blokus — four-fold symmetry</title>
<style>
  :root{ --ground:#0f1117; --ink:#e9eaf1; --muted:#9aa3b8;
    --R:#d94a44; --B:#3f74dd; --Y:#e6b53c; --G:#4ca85f; --board:#e9ebf1; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:22px 14px 40px}
  .fig{width:100%;max-width:680px}
  .stage{width:100%;background:#0f1117;border:1px solid #232838;border-radius:14px;padding:10px}
  svg{display:block;width:100%;height:auto}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .bar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;color:var(--ink);background:#1d2230;border:1px solid #2c3344;
    border-radius:8px;padding:7px 13px;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover{background:#252c3d;border-color:#3a4256}
  button.primary{background:#2a3350;border-color:#3a4a78}
  button.primary:hover{background:#31406a}
  .variants{display:flex;gap:6px;justify-content:center;margin-top:4px}
  .variants button{font-size:13px;padding:6px 12px}
  .variants button.sel{background:#2a3350;border-color:#5a79c8;color:#fff}
  .turn{font-size:14px;letter-spacing:.02em;min-height:20px;text-align:center;margin-top:10px}
  .vlabel{color:var(--muted);font-size:12.5px;text-align:center;margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div class="fig">
  <div class="variants">
    <button data-v="A" class="sel">A · iterative fold</button>
    <button data-v="B">B · line up &amp; fold ←</button>
    <button data-v="C">C · rotate all &amp; collapse</button>
  </div>
  <div class="stage" style="margin-top:8px">
    <svg id="svg" viewBox="0 0 700 540" role="img" aria-label="Blokus four-fold symmetry"></svg>
  </div>
  <div class="bar">
    <button id="stepBack" title="previous step">◀ Step</button>
    <button id="play" class="primary">▶ Play</button>
    <button id="stepFwd" title="next step">Step ▶</button>
    <button id="reset">↻ Reset</button>
  </div>
  <div class="turn mono" id="turn">A finished perfect game — four colors, one pinwheel.</div>
  <div class="vlabel" id="vlabel"></div>
</div>

]},{"move":10,"color":"B","piece":"F5","orient":7,"cells":[[4,15],[5,14],[5,15],[6,15],[6,16]]},{"move":11,"color":"G","piece":"F5","orient":8,"cells":[[14,14],[15,13],[15,14],[15,15],[16,13]]},{"move":12,"color":"Y","piece":"F5","orient":5,"cells":[[13,3],[13,4],[14,4],[14,5],[15,4]]},{"move":13,"color":"R","piece":"V5","orient":2,"cells":[[6,6],[6,7],[6,8],[7,6],[8,6]]},{"move":14,"color":"B","piece":"V5","orient":3,"cells":[[6,11],[6,12],[6,13],[7,13],[8,13]]},{"move":15,"color":"G","piece":"V5","orient":4,"cells":[[11,13],[12,13],[13,11],[13,12],[13,13]]},{"move":16,"color":"Y","piece":"V5","orient":1,"cells":[[11,6],[12,6],[13,6],[13,7],[13,8]]},{"move":17,"color":"R","piece":"U5","orient":4,"cells":[[6,3],[6,4],[7,4],[8,3],[8,4]]},{"move":18,"color":"B","piece":"U5","orient":1,"cells":[[3,11],[3,13],[4,11],[4,12],[4,13]]},{"move":19,"color":"G","piece":"U5","orient":2,"cells":[[11,15],[11,16],[12,15],[13,15],[13,16]]},{"move":20,"color":"Y","piece":"U5","orient":3,"cells":[[15,6],[15,7],[15,8],[16,6],[16,8]]},{"move":21,"color":"R","piece":"W5","orient":3,"cells":[[8,0],[8,1],[9,1],[9,2],[10,2]]},{"move":22,"color":"B","piece":"W5","orient":4,"cells":[[0,11],[1,10],[1,11],[2,9],[2,10]]},{"move":23,"color":"G","piece":"W5","orient":1,"cells":[[9,17],[10,17],[10,18],[11,18],[11,19]]},{"move":24,"color":"Y","piece":"W5","orient":2,"cells":[[17,9],[17,10],[18,8],[18,9],[19,8]]},{"move":25,"color":"R","piece":"N5","orient":1,"cells":[[11,1],[12,1],[13,0],[13,1],[14,0]]},{"move":26,"color":"B","piece":"N5","orient":2,"cells":[[0,5],[0,6],[1,6],[1,7],[1,8]]},{"move":27,"color":"G","piece":"N5","orient":3,"cells":[[5,19],[6,18],[6,19],[7,18],[8,18]]},{"move":28,"color":"Y","piece":"N5","orient":4,"cells":[[18,11],[18,12],[18,13],[19,13],[19,14]]},{"move":29,"color":"R","piece":"Z5","orient":2,"cells":[[14,3],[15,1],[15,2],[15,3],[16,1]]},{"move":30,"color":"B","piece":"Z5","orient":1,"cells":[[1,3],[1,4],[2,4],[3,4],[3,5]]},{"move":31,"color":"G","piece":"Z5","orient" 8]]},{"move":54,"color":"B","piece":"L4","orient":4,"cells":[[7,17],[8,15],[8,16],[8,17]]},{"move":55,"color":"G","piece":"L4","orient":1,"cells":[[15,11],[16,11],[17,11],[17,12]]},{"move":56,"color":"Y","piece":"L4","orient":2,"cells":[[11,2],[11,3],[11,4],[12,2]]},{"move":57,"color":"R","piece":"Y5","orient":6,"cells":[[0,7],[0,8],[0,9],[0,10],[1,9]]},{"move":58,"color":"B","piece":"Y5","orient":7,"cells":[[7,19],[8,19],[9,18],[9,19],[10,19]]},{"move":59,"color":"G","piece":"Y5","orient":8,"cells":[[18,10],[19,9],[19,10],[19,11],[19,12]]},{"move":60,"color":"Y","piece":"Y5","orient":5,"cells":[[9,0],[10,0],[10,1],[11,0],[12,0]]},{"move":61,"color":"R","piece":"O4","orient":1,"cells":[[9,15],[9,16],[10,15],[10,16]]},{"move":62,"color":"B","piece":"O4","orient":1,"cells":[[15,9],[15,10],[16,9],[16,10]]},{"move":63,"color":"G","piece":"O4","orient":1,"cells":[[9,3],[9,4],[10,3],[10,4]]},{"move":64,"color":"Y","piece":"O4","orient":1,"cells":[[3,9],[3,10],[4,9],[4,10]]},{"move":65,"color":"R","piece":"X5","orient":1,"cells":[[11,17],[12,16],[12,17],[12,18],[13,17]]},{"move":66,"color":"B","piece":"X5","orient":1,"cells":[[16,7],[17,6],[17,7],[17,8],[18,7]]},{"move":67,"color":"G","piece":"X5","orient":1,"cells":[[6,2],[7,1],[7,2],[7,3],[8,2]]},{"move":68,"color":"Y","piece":"X5","orient":1,"cells":[[1,12],[2,11],[2,12],[2,13],[3,12]]},{"move":69,"color":"R","piece":"I4","orient":2,"cells":[[13,19],[14,19],[15,19],[16,19]]},{"move":70,"color":"B","piece":"I4","orient":1,"cells":[[19,3],[19,4],[19,5],[19,6]]},{"move":71,"color":"G","piece":"I4","orient":2,"cells":[[3,0],[4,0],[5,0],[6,0]]},{"move":72,"color":"Y","piece":"I4","orient":1,"cells":[[0,13],[0,14],[0,15],[0,16]]},{"move":73,"color":"R","piece":"I3","orient":2,"cells":[[2,19],[3,19],[4,19]]},{"move":74,"color":"B","piece":"I3","orient":1,"cells":[[19,15],[19,16],[19,17]]},{"move":75,"color":"G","piece":"I3","orient":2,"cells":[[15,0],[16,0],[17,0]]},{"move":76,"color":"Y","piece":"I3","orient":1,"cells":[[0,2],[0,3],[0,4]]},{"move":77,"color":"R","piece":"P5","orient":6,"cells":[[0,17],[0,18],[1,16],[1,17],[1,18]]},{"move":78,"color":"B","piece":"P5","orient":7,"cells":[[16,18],[17,18],[17,19],[18,18],[18,19]]},{"move":79,"color":"G","piece":"P5","orient":8,"cells":[[18,1],[18,2],[18,3],[19,1],[19,2]]},{"move":80,"color":"Y","piece":"P5","orient":5,"cells":[[1,0],[1,1],[2,0],[2,1],[3,1]]},{"move":81,"color":"R","piece":"I1","orient":1,"cells":[[0,12]]},{"move":82,"color":"B","piece":"I1","orient":1,"cells":[[12,19]]},{"move":83,"color":"G","piece":"I1","orient":1,"cells":[[19,7]]},{"move":84,"color":"Y","piece":"I1","orient":1,"cells":[[7,0]]}]}};
const CELL=16, N=20, BW=N*CELL;              // board 320px
const BX=(700-BW)/2, BY=18;                  // board top-centred
const S=0.46;                                // scale for peeled blocks
const SC=[104,268,432,596], RCY=435;         // bottom row slot centres
const COLORS={R:'#d94a44',B:'#3f74dd',Y:'#e6b53c',G:'#4ca85f'};
const ORDER=['R','B','G','Y'];
const SVGNS='http://www.w3.org/2000/svg';
const svg=document.getElementById('svg');
function el(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e;}

const cellsOf=color=>DATA.game.moves.filter(m=>m.color===color);
function centroidOf(color){let sr=0,sc=0,n=0;
  for(const mv of cellsOf(color)) for(const [r,c] of mv.cells){sr+=r+0.5;sc+=c+0.5;n++;}
  return {r:sr/n,c:sc/n};}
function pivotOf(color){const t=centroidOf(color);return {x:BX+t.c*CELL,y:BY+t.r*CELL};}

// rotation (deg, about centroid) that makes a colour congruent to red — short spins first
function matchDeg(color){
  const rel=col=>{const t=centroidOf(col);
    return cellsOf(col).flatMap(mv=>mv.cells).map(([r,c])=>[c+0.5-t.c, r+0.5-t.r]);};
  const key=a=>new Set(a.map(([x,y])=>x.toFixed(2)+','+y.toFixed(2)));
  const redK=key(rel('R')), X=rel(color);
  for(const deg of [0,90,-90,180,-180,270,-270]){
    const a=deg*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
    const rot=X.map(([x,y])=>[x*ca-y*sa, x*sa+y*ca]);
    const k=key(rot); if(k.size===redK.size && [...k].every(v=>redK.has(v))) return deg;
  }
  return 0;
}
const MD={}; for(const c of ORDER) MD[c]=matchDeg(c);

// perimeter for a piece's cells at absolute board origin
function perimeter(cells){
  const has=new Set(cells.map(c=>c.r+','+c.c)); let d='';
  for(const {r,c} of cells){const x=BX+c*CELL, y=BY+r*CELL;
    if(!has.has((r-1)+','+c)) d+=`M${x} ${y}h${CELL}`;
    if(!has.has((r+1)+','+c)) d+=`M${x} ${y+CELL}h${CELL}`;
    if(!has.has(r+','+(c-1))) d+=`M${x} ${y}v${CELL}`;
    if(!has.has(r+','+(c+1))) d+=`M${x+CELL} ${y}v${CELL}`;}
  return d;
}

// ---- scenery: board + grid ----
el('rect',{x:BX,y:BY,width:BW,height:BW,fill:'var(--board)',rx:3},svg);
let gd=''; for(let i=0;i<=N;i++) gd+=`M${BX+i*CELL} ${BY}V${BY+BW}M${BX} ${BY+i*CELL}H${BX+BW}`;
el('path',{d:gd,stroke:'#8b93a8','stroke-opacity':0.22,'stroke-width':0.5,fill:'none'},svg);

// ---- faint full-board backdrop (original pinwheel stays as a ghost) ----
for(const color of ORDER) for(const mv of cellsOf(color)) for(const [r,c] of mv.cells)
  el('rect',{x:BX+c*CELL,y:BY+r*CELL,width:CELL,height:CELL,fill:COLORS[color],opacity:0.12},svg);

// soft "lifted" shadow
const defs=el('defs',{},svg);
const filt=el('filter',{id:'lift',x:'-30%',y:'-30%',width:'160%',height:'160%'},defs);
el('feDropShadow',{dx:0,dy:5,stdDeviation:6,'flood-color':'#000','flood-opacity':0.5},filt);

// ---- movable bright block per colour ----
const group={};
for(const color of ORDER){
  const g=el('g',{filter:'url(#lift)'},svg);
  for(const mv of cellsOf(color)){
    const cells=mv.cells.map(c=>({r:c[0],c:c[1]}));
    for(const {r,c} of cells)
      el('rect',{x:BX+c*CELL,y:BY+r*CELL,width:CELL,height:CELL,fill:COLORS[color]},g);
    el('path',{d:perimeter(cells),stroke:'#0d0f16','stroke-width':1,fill:'none','stroke-linecap':'square'},g);
  }
  group[color]=g;
}

// ---- pose -> SVG matrix ----
const HOME={}; for(const c of ORDER){const p=pivotOf(c); HOME[c]={deg:0,scale:1,cx:p.x,cy:p.y};}
function matFromPose(color,pose){
  const p=pivotOf(color), a=pose.deg*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
  const A00=pose.scale*ca, A01=-pose.scale*sa, A10=pose.scale*sa, A11=pose.scale*ca;
  return {a:A00,b:A10,c:A01,d:A11,
    e:pose.cx-(A00*p.x+A01*p.y), f:pose.cy-(A10*p.x+A11*p.y)};
}
function setPose(color,pose){const m=matFromPose(color,pose);
  group[color].setAttribute('transform',`matrix(${m.a} ${m.b} ${m.c} ${m.d} ${m.e} ${m.f})`);}
const at=(color,slot,deg)=>({deg:deg||0,scale:S,cx:SC[slot],cy:RCY});

// ---- variant timelines: each stage overrides some colours' target poses ----
const VARIANTS={
  A:[
    {dur:800,label:'Peel red down',set:{R:at('R',0,0)}},
    {dur:900,label:'Blue — rotate to match red',set:{B:at('B',1,MD.B)}},
    {dur:700,label:'Blue — fold onto red',set:{B:at('B',0,MD.B)}},
    {dur:900,label:'Green — rotate to match red',set:{G:at('G',1,MD.G)}},
    {dur:700,label:'Green — fold onto red',set:{G:at('G',0,MD.G)}},
    {dur:900,label:'Yellow — rotate to match red',set:{Y:at('Y',1,MD.Y)}},
    {dur:700,label:'Yellow — fold onto red — one pattern',set:{Y:at('Y',0,MD.Y)}},
  ],
  B:[
    {dur:650,label:'Peel red',set:{R:at('R',0,0)}},
    {dur:650,label:'Peel blue',set:{B:at('B',1,0)}},
    {dur:650,label:'Peel green',set:{G:at('G',2,0)}},
    {dur:650,label:'Peel yellow — four spirals, four orientations',set:{Y:at('Y',3,0)}},
    {dur:1000,label:'Fold yellow onto red (rotate 90°)',set:{Y:at('Y',0,MD.Y)}},
    {dur:1000,label:'Fold green onto red (rotate 180°)',set:{G:at('G',0,MD.G)}},
    {dur:1000,label:'Fold blue onto red (rotate −90°) — one pattern',set:{B:at('B',0,MD.B)}},
  ],
  C:[
    {dur:1000,label:'Peel all four apart, side by side',
      set:{R:at('R',0,0),B:at('B',1,0),G:at('G',2,0),Y:at('Y',3,0)}},
    {dur:1100,label:'Rotate each to red&rsquo;s orientation — all identical',
      set:{B:at('B',1,MD.B),G:at('G',2,MD.G),Y:at('Y',3,MD.Y)}},
    {dur:1100,label:'Collapse all onto one — a single quarter',
      set:{B:at('B',0,MD.B),G:at('G',0,MD.G),Y:at('Y',0,MD.Y)}},
  ],
};

// build cumulative states[0..n] for the active variant
let stages=[], states=[], durs=[], ci=0, cur={}, playing=false, raf=null;
function loadVariant(v){
  stages=VARIANTS[v];
  states=[{}]; for(const c of ORDER) states[0][c]={...HOME[c]};
  durs=[0];
  for(const st of stages){
    const s={}; const prev=states[states.length-1];
    for(const c of ORDER) s[c]={...(st.set[c]||prev[c])};
    states.push(s); durs.push(st.dur);
  }
  ci=0; cur={}; for(const c of ORDER) cur[c]={...states[0][c]};
  render(); updateLabel(); updateBtn();
}
function render(){ for(const c of ORDER) setPose(c,cur[c]); }
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerpP=(a,b,u)=>({deg:a.deg+(b.deg-a.deg)*u, scale:a.scale+(b.scale-a.scale)*u,
  cx:a.cx+(b.cx-a.cx)*u, cy:a.cy+(b.cy-a.cy)*u});

function animateTo(idx,cb){
  if(raf)cancelAnimationFrame(raf);
  idx=Math.max(0,Math.min(states.length-1,idx));
  const from={}; for(const c of ORDER) from[c]={...cur[c]};
  const to=states[idx], dur=durs[Math.max(idx,1)]||800, start=performance.now();
  (function frame(now){let p=(now-start)/dur; if(p>1)p=1; const u=ease(p);
    for(const c of ORDER) cur[c]=lerpP(from[c],to[c],u);
    render();
    if(p<1) raf=requestAnimationFrame(frame);
    else{ci=idx; for(const c of ORDER) cur[c]={...to[c]}; render(); updateLabel(); updateBtn(); if(cb)cb();}
  })(start);
}
function playChain(){ if(!playing) return;
  if(ci>=states.length-1){playing=false;updateBtn();return;}
  animateTo(ci+1,()=>{ if(playing) setTimeout(playChain,140); });
  updateLabel();
}
const turn=document.getElementById('turn'), vlabel=document.getElementById('vlabel'),
      btn=document.getElementById('play');
function updateLabel(){
  turn.innerHTML = ci===0 ? 'A finished perfect game — four colors, one pinwheel.'
    : stages[ci-1].label;
  vlabel.textContent = `step ${ci} / ${states.length-1}`;
}
function updateBtn(){btn.innerHTML = playing ? '❚❚ Pause'
  : (ci>=states.length-1 ? '↻ Replay' : '▶ Play');}

btn.onclick=()=>{ if(playing){playing=false;if(raf)cancelAnimationFrame(raf);updateBtn();return;}
  if(ci>=states.length-1){ci=0;for(const c of ORDER)cur[c]={...states[0][c]};render();}
  playing=true; updateBtn(); playChain(); };
document.getElementById('stepFwd').onclick=()=>{playing=false;animateTo(ci+1);};
document.getElementById('stepBack').onclick=()=>{playing=false;animateTo(ci-1);};
document.getElementById('reset').onclick=()=>{playing=false;animateTo(0);};
document.querySelectorAll('.variants button').forEach(b=>b.onclick=()=>{
  playing=false; if(raf)cancelAnimationFrame(raf);
  document.querySelectorAll('.variants button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); loadVariant(b.dataset.v);
});

loadVariant('A');
</script>
</body>
</html>
