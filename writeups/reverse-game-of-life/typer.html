<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game of Life Typer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  /* Same colours as the blog post (gol_blog.html), light/dark by device setting. */
  :root{ --ground:#f3f5f0; --panel:#eaede5; --hair:#cfd6cb; --ink:#1a1f1c; --muted:#5d6b62; --faint:#7d8a81;
    --accent:#2f7d5b; --cell:#1a1f1c; --past:#c95d0e; --future:#2f63d2;
    --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",Menlo,monospace; }
  @media (prefers-color-scheme: dark){
    :root{ --ground:#0d110f; --panel:#141a16; --hair:#26302a; --ink:#e8eee9; --muted:#8fa095; --faint:#6f7f75;
      --accent:#6fd8a4; --cell:#e8eee9; --past:#d9782a; --future:#6f9bff; } }
  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:15px}
  .wrap{max-width:1100px; margin:0 auto; padding:16px}
  .top{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
  input[type=text]{font:inherit; font-size:1.05rem; flex:1; min-width:200px; color:var(--ink); background:var(--panel);
    border:1px solid var(--hair); border-radius:4px; padding:7px 10px}
  label{color:var(--muted); font-size:.88rem}
  select{font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--hair); border-radius:4px; padding:4px 6px}
  button{font:inherit; font-size:.88rem; color:var(--ink); background:var(--panel); border:1px solid var(--hair);
    border-radius:4px; padding:6px 12px; cursor:pointer; min-width:40px}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent); border-color:var(--accent); color:var(--ground); font-weight:600}
  canvas{display:block; width:100%; margin:16px 0 8px}
  .controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  input[type=range]{flex:1; min-width:160px; accent-color:var(--accent)}
  .frame{font-family:var(--mono); font-size:.85rem; min-width:13ch}
  .frame.past{color:var(--past)} .frame.now{color:var(--accent); font-weight:600} .frame.future{color:var(--future)}
  .note{font-size:.8rem; color:var(--faint); margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <input type="text" id="text" value="Game of Life" maxlength="60" aria-label="Text to type" spellcheck="false">
    <label>Steps back <select id="depth"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label>
  </div>
  <canvas id="board" aria-label="Your text as Game of Life seeds"></canvas>
  <div class="controls">
    <button id="toStart" title="Back to the seeds">⏮</button>
    <button id="back" title="One step back">◀</button>
    <button id="play">Play</button>
    <button id="fwd" title="One step forward">▶</button>
    <button id="toLetter" title="Jump to the letters">Letters</button>
    <input type="range" id="scrub" min="0" max="1" value="0" aria-label="Timeline">
    <span class="frame" id="frame"></span>
  </div>
  <div class="controls" style="margin-top:8px">
    <label>Speed <select id="speed"><option value="600">slow</option><option value="300" selected>normal</option><option value="120">fast</option></select></label>
    <label>After the letters <select id="future"><option value="sym" selected>same as steps back (3)</option><option value="5">+5 steps</option><option value="10">+10 steps</option><option value="15">+15 steps</option><option value="30">+30 steps</option><option value="100">+100 steps</option></select></label>
    <button id="loop" class="on" title="Play forward to the end, then backward to the seeds, and repeat">Back and forth</button>
  </div>
  <p class="note" id="note"></p>
</div>

<script>
const FONT = JSON.parse(document.getElementById("font-data").textContent).chars;
// Only offer a depth once every character has a seed for it (4 steps back is still being solved).
for (const opt of [...document.querySelectorAll("#depth option")])
  if (!Object.values(FONT).every(f => f[opt.value])) opt.remove();
const G = 10;                                     // each character lives on its own 10x10 wrap-around grid
const $ = id => document.getElementById(id);
const canvas = $("board"), ctx = canvas.getContext("2d");
let boxes = [], frame = 0, depth = 3, timer = null, loop = true, dir = 1;   // "Back and forth" on by default
// Steps shown after the letters. The default matches the steps back, so the letters sit in the middle of the timeline.
const futureSteps = () => $("future").value === "sym" ? depth : +$("future").value;

// One B3/S23 step on a 10x10 wrap-around grid (the same rules the seeds were solved for).
function step(g) {
  const n = new Uint8Array(G * G);
  for (let r = 0; r < G; r++) for (let c = 0; c < G; c++) {
    let s = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++)
      if (dr || dc) s += g[((r + dr + G) % G) * G + (c + dc + G) % G];
    n[r * G + c] = (s === 3 || (g[r * G + c] && s === 2)) ? 1 : 0;
  }
  return n;
}
const parse = s => Uint8Array.from(s, ch => +ch);

// Precompute every frame for every character: frame 0 = seeds, frame `depth` = letters, then the future.
// A character without a seed at this depth uses its deepest one and starts blank, so all letters land together.
function build() {
  const text = $("text").value, total = depth + futureSteps(), missing = new Set();
  $("future").options[0].text = `same as steps back (${depth})`;
  boxes = [...text].map(ch => {
    const f = FONT[ch.charCodeAt(0)];
    const frames = [];
    if (!f) { for (let i = 0; i <= total; i++) frames.push(null); if (ch !== " ") missing.add(ch); else frames.space = true; return frames; }
    let d = depth; while (d > 0 && !f[d]) d--;
    if (d < depth) missing.add(ch);
    let g = d ? parse(f[d]) : parse(f.glyph);
    for (let i = 0; i < depth - d; i++) frames.push(new Uint8Array(G * G));
    frames.push(g);
    for (let i = depth - d + 1; i <= total; i++) frames.push(g = step(g));
    return frames;
  });
  $("scrub").max = total;
  frame = Math.min(frame, total);
  $("note").textContent = missing.size
    ? `No ${depth}-step seed yet for: ${[...missing].join(" ")} (shown from fewer steps back, or blank if not in the font).`
    : "Every character here grows from its own seed on its own 10 × 10 grid with wrap-around edges.";
  resize();
}

function resize() {
  const dpr = window.devicePixelRatio || 1, w = canvas.parentElement.clientWidth - 32;
  const n = Math.max(1, boxes.length), perLine = Math.min(n, Math.max(4, Math.floor(w / 64)));
  const pos = wrap(perLine), lines = Math.max(1, ...pos.filter(Boolean).map(p => p.row + 1));
  const cell = Math.min(8, w / (perLine * (G + 0.6)));
  const gap = cell * 0.6, pitch = G * cell + gap;        // small gap between boxes so each one's edges show
  canvas.style.height = lines * pitch + "px";
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(lines * pitch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  Object.assign(resize, { pos, cell, pitch, w });
  draw();
  // When shown in a frame inside the blog post, tell the post how tall the page is so the frame fits it.
  if (parent !== window) parent.postMessage({ typerHeight: document.querySelector(".wrap").offsetHeight }, "*");
}

// Word wrap: a word that doesn't fit on the rest of the line moves whole to the next line, and a space that
// would start a new line is dropped. Only a word longer than a full line is split. Returns {col,row} per character
// (null for a dropped space).
function wrap(perLine) {
  const text = [...$("text").value], pos = [];
  let col = 0, row = 0;
  for (let i = 0; i < text.length; i++) {
    if (text[i] === " ") {
      if (col === 0 && row > 0) { pos.push(null); continue; }
      if (col >= perLine) { row++; col = 0; pos.push(null); continue; }
      pos.push({ col: col++, row }); continue;
    }
    if (i === 0 || text[i - 1] === " ") {             // start of a word: will it fit on this line?
      let len = 0; while (i + len < text.length && text[i + len] !== " ") len++;
      if (col > 0 && col + len > perLine && len <= perLine) { row++; col = 0; }
    }
    if (col >= perLine) { row++; col = 0; }
    pos.push({ col: col++, row });
  }
  return pos;
}

function draw() {
  const { pos, cell, pitch, w } = resize, css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue("--cell").trim(), box = css.getPropertyValue("--panel").trim();
  ctx.clearRect(0, 0, w, canvas.height);
  boxes.forEach((frames, i) => {
    if (frames.space || !pos[i]) return;
    const g = frames[frame], x0 = pos[i].col * pitch, y0 = pos[i].row * pitch;
    ctx.fillStyle = box; ctx.fillRect(x0, y0, G * cell, G * cell);
    if (!g) return;
    ctx.fillStyle = ink;
    for (let k = 0; k < G * G; k++) if (g[k]) ctx.fillRect(x0 + (k % G) * cell, y0 + Math.floor(k / G) * cell, cell - 0.5, cell - 0.5);
  });
  $("scrub").value = frame;
  const t = frame - depth, el = $("frame");
  el.className = "frame " + (t < 0 ? "past" : t === 0 ? "now" : "future");
  el.textContent = t < 0 ? (frame === 0 ? `seeds (${depth} back)` : `${-t} step${t === -1 ? "" : "s"} to go`) : t === 0 ? "letters" : `+${t} after`;
}

function go(f) { frame = Math.max(0, Math.min(+$("scrub").max, f)); draw(); }
function stop() { clearInterval(timer); timer = null; $("play").textContent = "Play"; }
// Plays forward to the end. With "Back and forth" on, it then reverses to the seeds and repeats.
function play() {
  if (timer) return stop();
  const end = +$("scrub").max;
  if (!loop && frame >= end) frame = 0;
  if (frame <= 0) dir = 1; else if (frame >= end) dir = -1;
  $("play").textContent = "Pause";
  timer = setInterval(() => {
    // Pause briefly on the letters (in either direction) so they can be read.
    if (frame === depth && !play.held) { play.held = true; return; }
    play.held = false;
    if (frame + dir > end || frame + dir < 0) {
      if (!loop) return stop();
      dir = -dir;
    }
    go(frame + dir);
  }, +$("speed").value);
}

$("text").addEventListener("input", () => { stop(); frame = 0; build(); });
$("depth").addEventListener("change", e => { stop(); depth = +e.target.value; frame = 0; build(); });
$("speed").addEventListener("change", () => { if (timer) { stop(); play(); } });
$("future").addEventListener("change", () => { stop(); build(); });
$("loop").addEventListener("click", e => { loop = !loop; e.target.classList.toggle("on", loop); });
$("play").addEventListener("click", play);
$("back").addEventListener("click", () => { stop(); go(frame - 1); });
$("fwd").addEventListener("click", () => { stop(); go(frame + 1); });
$("toStart").addEventListener("click", () => { stop(); go(0); });
$("toLetter").addEventListener("click", () => { stop(); go(depth); });
$("scrub").addEventListener("input", e => { stop(); go(+e.target.value); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
window.addEventListener("resize", resize);
window.addEventListener("load", resize);            // again once the web fonts are in (controls may rewrap)
build();
</script>
